schema_version = "0.2"

[application]
id = "com.charleshartmann.Simmer"
name = "Simmer"
version = "1.0.0"
entrypoint = "src/main.py"

[platform]
ui_contract = "1"
semantics_contract = "1"

[responsive]
adaptive = true
test_widths = [360, 500, 1024, 1280]
input_modes = ["pointer", "touch", "keyboard"]
presentation_modes = ["windowed", "fullscreen-mobile"]

[distribution]
substrate = "flatpak"
flatpak_manifest = "flatpak/com.charleshartmann.Simmer.json"
appstream_metadata = "data/com.charleshartmann.Simmer.metainfo.xml"
desktop_file = "data/com.charleshartmann.Simmer.desktop"
icon = "data/com.charleshartmann.Simmer.svg"
portal_first = true
portals = ["file-chooser", "notifications", "inhibit", "open-uri"]

[lifecycle]
app_data = "retained"
cache = "removable"
user_documents = "preserved"
reset_supported = true
uninstall_choices = ["keep-data", "remove-app-data"]

[conformance]
accessibility = true
keyboard = true
semantics = true
reduced_motion = true
evidence = "verification/luma-native-evidence.json"

[tv]
supported = true
tile = "data/com.charleshartmann.Simmer-tv.svg"
presentation = "fullscreen"
